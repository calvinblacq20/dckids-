name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Syntax check (every shipped JS file)
        run: |
          for f in app.js admin.js admin-recovery-view.js gradient.js service-worker.js server/server.js server/db.js server/recovery_codes.js server/backup_db.js server/test_recovery_codes.js server/test_admin_recovery_view.js server/test_smoke.js; do
            node -c "$f"
          done

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Smoke tests
        working-directory: server
        run: npm test

      # Split so the blocking gate covers what actually reaches production.
      # The remaining high advisories are all tailwindcss (a devDependency)
      # and its build-time tree; clearing them needs the 3 -> 4 migration,
      # which is its own piece of work. Reported, not merged on.
      - name: Dependency audit - production (fail on high severity)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit - dev tooling (report only)
        working-directory: server
        continue-on-error: true
        run: npm audit --audit-level=high
