name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Syntax check (every shipped JS file)
        run: |
          for f in app.js admin.js service-worker.js server/server.js server/db.js server/backup_db.js server/test_smoke.js; do
            node -c "$f"
          done

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Smoke tests
        working-directory: server
        run: npm test

      # Split so the blocking gate covers what actually reaches production.
      # The remaining high advisories are all tailwindcss (a devDependency)
      # and its build-time tree; clearing them needs the 3 -> 4 migration,
      # which is its own piece of work. Reported, not merged on.
      - name: Dependency audit - production (fail on high severity)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit - dev tooling (report only)
        working-directory: server
        continue-on-error: true
        run: npm audit --audit-level=high

  # Every commit in the history, not just today's files: the repo is public, so
  # a key committed once and overwritten later is still readable. Findings are
  # redacted in the log. Known placeholders are allowlisted in .gitleaks.toml.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified release)
        run: |
          v=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v$v"
          curl -sSfLO "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          grep "gitleaks_${v}_linux_x64.tar.gz" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks

      - name: Secret scan (full history)
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml .

  # Injection sinks, eval, path traversal and hard-coded credentials in the
  # server, which no outside scanner can see. The browser code is left out:
  # its pages are built with innerHTML over escapeHtml by design, and those
  # rules would bury anything real.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep==1.182.1

      - name: SAST (server)
        run: >-
          semgrep scan --error --metrics=off
          --config p/javascript --config p/nodejs --config p/expressjs
          --exclude 'test_*.js' server/
